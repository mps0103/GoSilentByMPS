org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
android.useAndroidX=true
android.enableJetifier=false
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64
newArchEnabled=true
hermesEnabled=true
# Draw behind the status and navigation bars on every Android version, as
# Android 15+ enforces for apps targeting API 35+. Insets are applied in JS
# (react-native-safe-area-context).
edgeToEdgeEnabled=true
# AGP 9 compatibility flags used by the React Native 0.88 template.
android.builtInKotlin=false
android.newDsl=false
